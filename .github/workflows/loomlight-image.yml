name: Loomlight n8n image

on:
  pull_request:
    branches:
      - loomlight/main
    paths:
      - '.github/workflows/loomlight-image.yml'
      - 'docker/images/n8n/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
  push:
    branches:
      - loomlight/main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: loomlight-n8n-image-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: '--max-old-space-size=7168'
  NODE_VERSION: '24.18.1'
  REGISTRY: ghcr.io
  IMAGE_NAME: yvesalbuquerque/n8n

jobs:
  build:
    name: Build and validate linux/amd64 image
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Build n8n application
        uses: ./.github/actions/setup-nodejs
        with:
          build-command: pnpm build:n8n
          enable-docker-cache: 'true'
        env:
          RELEASE: loomlight-${{ github.sha }}

      - name: Resolve image metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./packages/cli/package.json').version")"
          short_sha="$(git rev-parse --short=12 HEAD)"
          immutable_tag="${version}-loomlight.${short_sha}"
          image="${REGISTRY}/${IMAGE_NAME}"

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "immutable_tag=${immutable_tag}" >> "$GITHUB_OUTPUT"
          echo "immutable_ref=${image}:${immutable_tag}" >> "$GITHUB_OUTPUT"
          echo "moving_ref=${image}:loomlight-main" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image for pull request
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ./docker/images/n8n/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: loomlight-n8n:pr
          build-args: |
            NODE_VERSION=${{ env.NODE_VERSION }}
            N8N_VERSION=${{ steps.metadata.outputs.version }}
            N8N_RELEASE_TYPE=dev

      - name: Smoke test pull-request image
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          actual="$(docker run --rm --entrypoint n8n loomlight-n8n:pr --version)"
          test "$actual" = "${{ steps.metadata.outputs.version }}"

      - name: Build and publish immutable image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ./docker/images/n8n/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: true
          sbom: true
          tags: |
            ${{ steps.metadata.outputs.immutable_ref }}
            ${{ steps.metadata.outputs.moving_ref }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.metadata.outputs.version }}
          build-args: |
            NODE_VERSION=${{ env.NODE_VERSION }}
            N8N_VERSION=${{ steps.metadata.outputs.version }}
            N8N_RELEASE_TYPE=dev

      - name: Record published candidate
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          {
            echo '### Published Loomlight n8n candidate'
            echo ''
            echo '- Immutable image: `${{ steps.metadata.outputs.immutable_ref }}`'
            echo '- Source commit: `${{ github.sha }}`'
            echo '- Architecture: `linux/amd64`'
            echo ''
            echo 'Publishing does not deploy this image. Runtime adoption requires a separate reviewed `loomlight-infra` change.'
          } >> "$GITHUB_STEP_SUMMARY"
